services:
  - type: web
    name: research-copilot
    runtime: docker
    plan: free
    region: singapore  # same region as the Neon database, ap-southeast-1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DAILY_ANSWER_CAP
        value: "200"
      - key: SEARCH_MODE
        value: hybrid  # the reranker exceeds the free 512 MB
      - key: WEB_ORIGINS
        value: https://research-copilot-black.vercel.app  # the Vercel demo page
      - key: CITATION_SUPPORT_CHECK
        value: "off"  # off by default: false-positive on whole chunks, and the NLI model plus the embedder peak near 460 MB; see ledger RC1
      - key: ANSWERS_PER_IP_PER_HOUR
        value: "10"
