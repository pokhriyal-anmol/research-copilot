name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: copilot, POSTGRES_PASSWORD: copilot, POSTGRES_DB: copilot}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U copilot" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://copilot:copilot@localhost:5433/copilot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest --cov=copilot --cov-report=term-missing
      - run: uv export --frozen --no-hashes --no-emit-project -o /tmp/req.txt && uv run pip-audit --disable-pip --no-deps -r /tmp/req.txt
