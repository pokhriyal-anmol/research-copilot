name: Synthetic checks
# Every 5 minutes: backend health (also keeps Render's free instance awake) and the Vercel page.
# Hourly: one full answer, which must also finish within MAX_SECONDS. A failed run emails the repo owner.
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  URL: https://research-copilot-au2k.onrender.com
  PAGE: https://research-copilot-black.vercel.app
  MAX_SECONDS: 40  # normal answers take 8 to 9 s; one provider timing out (25 s) then the fallback is about 35 s
jobs:
  health:
    if: github.event.schedule != '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --max-time 120 --retry 2 --retry-all-errors "$URL/health"
  page:
    if: github.event.schedule != '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --max-time 30 --retry 2 --retry-all-errors "$PAGE" | grep -q '<title>Research Copilot</title>'
  answer:
    if: github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask a question the corpus can answer
        run: |
          # The [synthetic] prefix lets a traces query separate these from real users.
          curl -fsS --max-time 120 --retry 2 --retry-all-errors "$URL/health" >/dev/null  # wake first, so a cold start is not counted
          start=$(date +%s)
          body=$(curl -fsS --max-time 150 -H 'content-type: application/json' \
            -d '{"question":"[synthetic] What retrieval methods do the papers compare?"}' "$URL/answer")
          elapsed=$(( $(date +%s) - start ))
          outcome=$(echo "$body" | jq -r .outcome)
          echo "outcome=$outcome seconds=$elapsed (limit $MAX_SECONDS)"
          test "$outcome" = answered
          test "$elapsed" -le "$MAX_SECONDS"
