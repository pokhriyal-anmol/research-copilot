[project]
name = "research-copilot"
version = "0.1.0"
description = "Answers questions about openly licensed CS papers, with checked citations."
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "httpx", "psycopg[binary]", "pgvector", "fastembed", "pypdf"]

[dependency-groups]
bench = [
    "bm25s>=0.3.16",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "sentence-transformers>=6.2.0",
]
dev = ["pytest", "pytest-cov", "ruff", "pip-audit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
